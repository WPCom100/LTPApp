providers = ["python"]

# No build phase needed — backend/main.py serves the frontend directly from
# the project root (see backend/main.py:_resolve_static). Earlier versions
# copied files into a `frontend/` directory via build.sh; that's no longer
# necessary and build.sh has been removed.

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
# --timeout-graceful-shutdown bounds the drain. The lifespan already releases
# open SSE streams (livesync.begin_shutdown), so this is the backstop, not the
# mechanism: without both, one open browser tab could hold a deploy for the
# full 30-minute stream lifetime and end in SIGKILL.
cmd = ". /opt/venv/bin/activate && uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-graceful-shutdown 20"
