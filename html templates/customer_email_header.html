<div style="padding:0px; max-width:900px; width: 100%">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width:100%;margin-top:5px">
        <tbody>
            <tr>
                <td valign="center" style="white-space:nowrap">
                    <table cellspacing="0" cellpadding="0" border="0">
                        <tbody>
                            <tr>
                                <td style="border-radius:3px;text-align:center;background:#ef5822"><a
                                        style="font-size:14px;color:#ffffff;display:block;padding:8px 12px 11px;text-decoration:none;font-weight:bold"
                                        href="{{viewUrl}}">View &amp; Accept or Decline</a></td>
                                <td>&nbsp;&nbsp;</td>
                                <td style="font-size:14px"><span style="font-weight:bold">{{refNumber}} -
                                        {{projectName}}</span><br><span>{{total}}</span></td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            <tr>
                <td valign="center">
                    <hr width="100%"
                        style="background-color:rgb(204,204,204);border:medium none;clear:both;display:block;font-size:0px;min-height:1px;line-height:0;margin:10px 0px">
                </td>
            </tr>
        </tbody>
    </table>
</div>
