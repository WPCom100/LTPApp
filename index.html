<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LTP Business Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    select option { background: #1a1a1a; color: #fff; }
    [contenteditable]:empty:before { content: attr(data-placeholder); color: #666; }
    blockquote { border-left: 3px solid #E8731A; padding-left: 12px; margin: 8px 0; color: #aaa; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ════════════════════════════════════════════════════════════════════
       SCRIPT LOAD ORDER — DO NOT REORDER WITHOUT READING THIS

       There's no bundler. Every script below executes immediately and
       attaches its public API to `window`. Later scripts assume earlier
       ones have already run, so the wrong order = silent breakage.

       Groups (top to bottom):
         0. Auth check — fires GET /auth/me and sets window.LTP_AUTH_USER.
            Must load before everything else so other scripts can read auth
            state during their own bootstrap.
         1. React (CDN UMD) — every component below uses React.createElement.
         2. Router — owns the hash and exposes window.LTPRouter; modules call it.
         3. Theme + cross-cutting utilities — color tokens, status enums, lookup
            helpers; everything below reads from window.LTP_THEME / LTP_STATUS / LTP_HELPERS.
         4. Data fallbacks — populate window.LTP_DATA_* used as initial state
            fallbacks in usePersistentState. data/settings.js MUST come before
            components/data-state.js (the hook merges its defaults at hydration).
         5. Shared components — UI primitives, the persistence hook, dialogs,
            error UI. data-state.js is the persistence chokepoint; it depends
            on the ltp_session cookie (set by /auth/callback) and theme.js.
         6. Feature modules — each shell pulls in its sub-modules. Within a
            shell group, leaves load first and the shell loads last.
            quotes-list.js exports totals helpers consumed by quotes-builder.js
            and modules/invoices.js, so list MUST precede those two.
         7. App shell — wires the whole tree together. Must load last.
         8. Mount — kicks React into the DOM.

       When adding a new file: figure out which group it belongs to, drop it
       at the END of that group, and confirm anything it reads is loaded
       above. If something errors on load, that's almost always the cause.
       ════════════════════════════════════════════════════════════════════ -->

  <!-- 0. Auth check — fires GET /auth/me; populates window.LTP_AUTH_USER -->
  <script src="components/auth.js"></script>

  <!-- 1. React -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- 2. Router (seeds hash, exposes window.LTPRouter) -->
  <script src="router.js"></script>

  <!-- 3. Theme + cross-cutting utilities -->
  <script src="theme.js"></script>

  <!-- 4. Data fallbacks — used as usePersistentState fallback arguments.
       Mostly empty post-migration; data/settings.js still ships UI defaults
       (tagColors, crewRoleOptions, email templates) merged in by the hook. -->
  <script src="data/companies.js"></script>
  <script src="data/contacts.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/quotes.js"></script>
  <script src="data/products.js"></script>
  <script src="data/services.js"></script>
  <script src="data/invoices.js"></script>
  <script src="data/labor.js"></script>
  <script src="data/settings.js"></script>
  <script src="data/allocations.js"></script>
  <script src="data/containers.js"></script>
  <script src="data/kits.js"></script>

  <!-- 5. Shared components.
       data-state.js: depends on the ltp_session cookie (set by /auth/callback);
         every fetch uses credentials:"include".
       helpers.js + status-enums.js: zero deps; loaded early so every
         component and module below can use window.LTP_HELPERS / LTP_STATUS.
       ui.js, *-dialog.js: read window.LTP_THEME.
       error-toasts.js: listens to "ltp-api-error" CustomEvents dispatched by data-state.js. -->
  <script src="components/helpers.js"></script>
  <script src="components/status-enums.js"></script>
  <script src="components/data-state.js"></script>
  <script src="components/ui.js"></script>
  <script src="components/search-select.js"></script>
  <script src="components/rich-text-editor.js"></script>
  <script src="components/schedule-editor.js"></script>
  <script src="components/confirm-delete.js"></script>
  <script src="components/confirm-dialog.js"></script>
  <script src="components/error-boundary.js"></script>
  <script src="components/error-toasts.js"></script>

  <!-- 6a. CRM sub-modules (leaves first, shell last) -->
  <script src="modules/calendar-grid.js"></script>
  <script src="modules/crm-notes.js"></script>
  <script src="modules/crm-meetings.js"></script>
  <script src="modules/crm-contacts.js"></script>
  <script src="modules/crm-companies.js"></script>
  <script src="modules/crm-projects.js"></script>
  <script src="modules/crm-shell.js"></script>

  <!-- 6b. Dashboard -->
  <script src="modules/dashboard.js"></script>

  <!-- 6c. Rentals sub-modules (utils first, shell last) -->
  <script src="modules/rentals-utils.js"></script>
  <script src="modules/rentals-maintenance.js"></script>
  <script src="modules/rentals-allocations.js"></script>
  <script src="modules/rentals-equipment.js"></script>
  <script src="modules/rentals-availability.js"></script>
  <script src="modules/rentals-inventory.js"></script>
  <script src="modules/rentals-containers.js"></script>
  <script src="modules/rentals-kits.js"></script>
  <script src="modules/rentals-shell.js"></script>

  <!-- 6d. Quotes sub-modules.
       quotes-list.js MUST load before quotes-builder.js and invoices.js
       because it exports the totals helpers both consume (LTP_QUOTE_TOTALS, etc.). -->
  <script src="modules/quotes-list.js"></script>
  <script src="modules/quotes-builder.js"></script>
  <script src="modules/quotes-products.js"></script>
  <script src="modules/quotes-services.js"></script>
  <script src="modules/quotes-shell.js"></script>

  <!-- 6e. Remaining feature modules -->
  <script src="modules/invoices.js"></script>
  <script src="modules/labor.js"></script>
  <script src="modules/settings.js"></script>
  <script src="modules/schedule-builder.js"></script>
  <script src="modules/projects.js"></script>
  <script src="modules/calendar.js"></script>

  <!-- 7. App shell — wires everything; must load last -->
  <script src="app.js"></script>

  <!-- Mount -->
  <script>
    var root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(window.LTPApp));
  </script>
</body>
</html>
