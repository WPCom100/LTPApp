<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is REQUIRED before iOS resolves env(safe-area-inset-*)
       to non-zero — without it the safe-area padding in the shell and the
       public crew/client views silently collapses to 0 on notch/home-indicator
       devices. Pinch-zoom is intentionally left enabled (no maximum-scale/
       user-scalable=no) for accessibility. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LTP Business Suite</title>

  <!-- ── PWA / iOS home-screen app ──────────────────────────────────────────
       Makes LTPApp installable and full-screen from the iOS Share sheet.
       The manifest + service worker are served from the app origin; see
       backend/main.py (dedicated /manifest.webmanifest and /sw.js routes) and
       components/register-sw.js (registration lives in a same-origin .js file
       because the CSP script-src has no 'unsafe-inline'). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Status-bar + chrome tint. #131C21 = LTP_THEME.bg (the app field). -->
  <meta name="theme-color" content="#131C21" />
  <!-- Launch full-screen (no Safari chrome) when opened from the home screen.
       apple-mobile-web-app-capable is the iOS-specific flag; mobile-web-app-
       capable is the standardized equivalent honored by other browsers. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- black-translucent lets the app field extend under the status bar; the
       shell applies env(safe-area-inset-top) so content clears the clock. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LTPApp" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" sizes="192x192" />
  <!-- Self-hosted fonts (Playfair Display + DM Sans). Served from our own
       origin so the CSP can drop fonts.googleapis.com / fonts.gstatic.com.
       See assets/fonts.css and docs/SECURITY_REVIEW.md L8. -->
  <link href="/assets/fonts.css" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Page field matches the customer-facing surfaces' slate (theme.js bg). */
    body { background: #131C21; overflow: hidden; }
    /* The SPA shell fills #root. Use the DYNAMIC viewport height (dvh) so on
       iOS Safari the app matches the actually-visible area — `100vh` there is
       the toolbar-hidden height, which pushes bottom-anchored content (e.g. the
       quote builder's Totals) below the visible viewport. `100vh` first as a
       fallback for engines without dvh support. */
    /* --app-h is the true visible height set by components/viewport-height.js
       (window.innerHeight); it corrects iOS standalone where 100dvh can report
       the safe-area height and leave a dead gap below the shell. 100vh/100dvh
       remain as pre-JS fallbacks (cascade: last valid declaration wins). */
    #root { height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); }
    /* Calendar grid is a fixed-height, viewport-anchored container (chrome above
       it is ~134px). Same iOS dvh rationale as #root; vh first as a fallback. */
    .ltp-calendar-grid { height: calc(100vh - 134px); height: calc(100dvh - 134px); height: calc(var(--app-h, 100dvh) - 134px); }
    /* Email Send-modal editor: give every top-level paragraph the SAME spacing
       the sent mail uses (theme.js PARA_STYLE = margin:0;line-height:1) —
       single-spaced, the sender adds blank lines for gaps — regardless of
       whether the browser inserts <p> (Chrome) or <div> (Safari) on Enter.
       Keep these two values in sync. Marker blocks (<section>) and any nested
       layout are untouched — only direct paragraph children. */
    .ltp-email-editor > p, .ltp-email-editor > div { margin: 0; line-height: 1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2E3E48; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3C4F5B; }
    select option { background: #19242B; color: #EDF3F2; }
    [contenteditable]:empty:before { content: attr(data-placeholder); color: #6E7E86; }
    blockquote { border-left: 3px solid #EF5822; padding-left: 12px; margin: 8px 0; color: #93A3AB; }
    /* ── Brand micro-moments — shared with the customer views ──────────────
       .ltp-shimmer: the 4px orange loading bar from the crew call sheet.
       .ltp-btn-primary / .ltp-btn-quiet: hover lift + border warm-up used by
       components/ui.js Btn (values mirror crew/client-view injectStyle). */
    @keyframes ltp-shimmer { 0% { background-position: -120px 0; } 100% { background-position: 240px 0; } }
    .ltp-shimmer { background-image: linear-gradient(90deg,#64260F 0%,#FF921E 50%,#64260F 100%); background-size: 240px 4px; animation: ltp-shimmer 1.1s linear infinite; }
    .ltp-btn-primary { transition: transform .14s ease, filter .14s ease, box-shadow .14s ease; }
    .ltp-btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 4px 14px rgba(239,88,34,0.30); }
    .ltp-btn-primary:active { transform: translateY(0); }
    .ltp-btn-quiet { transition: border-color .14s ease, color .14s ease, background .14s ease; }
    .ltp-btn-quiet:hover { border-color: #445866; }
    /* Ruled list rows (components/ui.js LTPList/LTPRow): hairline between
       rows, none after the last (the panel's orange bottom rule closes it),
       and a quiet brightening on hover for clickable rows. */
    .ltp-list > .ltp-row { border-bottom: 1px solid #2E3E48; }
    .ltp-list > .ltp-row:last-child { border-bottom: none; }
    .ltp-row-click { transition: background .12s ease; }
    .ltp-row-click:hover { background: rgba(237,243,242,0.045); }

    /* ── Mobile / iOS PWA responsive layer ──────────────────────────────────
       The app styles almost everything with inline React style objects, so
       this class + element layer is where breakpoint and safe-area behavior
       live. The 600px breakpoint matches the public crew/client views
       (modules/crew-view.js) and the shared window.LTP_useIsMobile() hook.
       Desktop ( > 600px ) is completely unaffected by everything below. */

    /* Kill the grey iOS tap-flash on our interactive chrome (rows/buttons);
       we provide our own :active feedback. Pinch-zoom stays enabled. */
    .ltp-row-click, .ltp-btn-primary, .ltp-btn-quiet, .ltp-tap,
    .ltp-bottom-nav button { -webkit-tap-highlight-color: transparent; }

    /* Horizontally-scrollable tab strips (components/ui.js LTPTabs) hide their
       scrollbar — the overflow is discoverable by swiping. */
    .ltp-tabs-strip::-webkit-scrollbar { display: none; }

    /* On touch devices, replace hover affordances with an :active press state
       (hover never fires on touch, so rows/buttons looked dead). */
    @media (hover: none) {
      .ltp-row-click:active { background: rgba(237,243,242,0.06); }
      .ltp-btn-primary:active, .ltp-btn-quiet:active { filter: brightness(1.08); }
    }

    @media (max-width: 600px) {
      /* iOS zooms the page whenever a focused form control is < 16px. Force
         16px on mobile so focusing any field never zooms. !important is needed
         to beat the inline font sizes the components set (13px on shared
         inputs, 9–11px in the dense builder rows). */
      input, select, textarea { font-size: 16px !important; }

      /* iOS Safari renders date / time inputs with their OWN intrinsic control
         height — taller than our text inputs — plus an internal value element
         that carries default margins, so a date field looks oversized next to
         the fields around it (and the 16px rule above makes it worse). This is
         invisible in Chromium/desktop, which is why it only shows on iPhone.
         Stripping the native appearance makes these inputs obey the same box
         model (padding + font-size, with the global `box-sizing: border-box`)
         as every other field; zeroing the inner value's margin removes the
         last of the extra height. The whole field stays tappable and still
         opens the native picker. Mobile-only so desktop keeps its calendar
         glyph and native control. */
      input[type="date"],
      input[type="time"],
      input[type="datetime-local"],
      input[type="month"] {
        -webkit-appearance: none;
        appearance: none;
      }
      input[type="date"]::-webkit-date-and-time-value,
      input[type="time"]::-webkit-date-and-time-value,
      input[type="datetime-local"]::-webkit-date-and-time-value,
      input[type="month"]::-webkit-date-and-time-value {
        margin: 0;
        text-align: left;
      }

      /* LTPModal (components/ui.js) → full-screen sheet: fill the viewport with
         no floating card, and inset content from the notch + home indicator.
         classNames are applied in ui.js; dynamic bits stay inline.
         Height uses --app-h (the true screen height from
         components/viewport-height.js), NOT 100dvh — on an installed iOS PWA
         100dvh under-reports the screen, which left the sheet stopping short
         with a dark band below it (same bug that was fixed for the app shell).
         The backdrop drops inset:0's bottom so its own --app-h height wins. */
      .ltp-modal-backdrop {
        align-items: stretch !important;
        justify-content: stretch !important;
        padding: 0 !important;
        bottom: auto !important;
        height: var(--app-h, 100dvh) !important;
      }
      .ltp-modal-panel {
        width: 100% !important;
        max-width: 100% !important;
        height: var(--app-h, 100dvh) !important;
        max-height: var(--app-h, 100dvh) !important;
        border-radius: 0 !important;
        padding-top: calc(20px + env(safe-area-inset-top)) !important;
        padding-bottom: calc(24px + env(safe-area-inset-bottom)) !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ════════════════════════════════════════════════════════════════════
       SCRIPT LOAD ORDER — DO NOT REORDER WITHOUT READING THIS

       There's no bundler. Every script below executes immediately and
       attaches its public API to `window`. Later scripts assume earlier
       ones have already run, so the wrong order = silent breakage.

       Groups (top to bottom):
         0. Auth check — fires GET /auth/me and sets window.LTP_AUTH_USER.
            Must load before everything else so other scripts can read auth
            state during their own bootstrap.
         1. React (CDN UMD) — every component below uses React.createElement.
         2. Router — owns the hash and exposes window.LTPRouter; modules call it.
         3. Theme + cross-cutting utilities — color tokens, status enums, lookup
            helpers; everything below reads from window.LTP_THEME / LTP_STATUS / LTP_HELPERS.
         4. Data fallbacks — populate window.LTP_DATA_* used as initial state
            fallbacks in usePersistentState. data/settings.js MUST come before
            components/data-state.js (the hook merges its defaults at hydration).
         5. Shared components — UI primitives, the persistence hook, dialogs,
            error UI. data-state.js is the persistence chokepoint; it depends
            on the ltp_session cookie (set by /auth/callback) and theme.js.
            DOMPurify (CDN) + sanitize.js MUST load before rich-text-editor.js
            (which calls window.LTP_SANITIZE on every keystroke).
         6. Feature modules — each shell pulls in its sub-modules. Within a
            shell group, leaves load first and the shell loads last.
            quotes-list.js exports totals helpers consumed by quotes-builder.js
            and modules/invoices.js, so list MUST precede those two.
         7. App shell — wires the whole tree together.
         8. Mount — separate file (mount.js) NOT inline, so CSP's script-src
            doesn't need 'unsafe-inline'. Must load after app.js.

       When adding a new file: figure out which group it belongs to, drop it
       at the END of that group, and confirm anything it reads is loaded
       above. If something errors on load, that's almost always the cause.
       ════════════════════════════════════════════════════════════════════ -->

  <!-- App viewport height — runs FIRST (no deps) so --app-h is set before React
       mounts. Fixes the iOS standalone bottom gap where CSS 100dvh underreports
       the screen height. See components/viewport-height.js. -->
  <script src="components/viewport-height.js"></script>

  <!-- 0. Auth check — fires GET /auth/me; populates window.LTP_AUTH_USER -->
  <script src="components/auth.js"></script>

  <!-- 1. React (production UMD). SRI hashes pinned to v18.2.0; if you bump
       the version, recompute with:
         curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
          integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
          integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh"
          crossorigin="anonymous"></script>

  <!-- 2. Router (seeds hash, exposes window.LTPRouter) -->
  <script src="router.js"></script>

  <!-- 3. Theme + cross-cutting utilities -->
  <script src="theme.js"></script>

  <!-- 4. Data fallbacks — used as usePersistentState fallback arguments.
       Mostly empty post-migration; data/settings.js still ships UI defaults
       (tagColors, crewRoleOptions, email templates) merged in by the hook. -->
  <script src="data/companies.js"></script>
  <script src="data/contacts.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/quotes.js"></script>
  <script src="data/products.js"></script>
  <script src="data/services.js"></script>
  <script src="data/invoices.js"></script>
  <script src="data/labor.js"></script>
  <script src="data/settings.js"></script>
  <script src="data/allocations.js"></script>
  <script src="data/containers.js"></script>
  <script src="data/kits.js"></script>

  <!-- 5. Shared components.
       DOMPurify: external HTML sanitizer used by sanitize.js. MUST load
         before sanitize.js and before any component that calls
         window.LTP_SANITIZE.html (in particular rich-text-editor.js).
       sanitize.js: wraps DOMPurify with a strict allowlist; single source of
         truth for what HTML reaches the DOM. Used at every save AND every
         dangerouslySetInnerHTML site to prevent stored XSS from notes.
       data-state.js: depends on the ltp_session cookie (set by /auth/callback);
         every fetch uses credentials:"include".
       helpers.js + status-enums.js: zero deps; loaded early so every
         component and module below can use window.LTP_HELPERS / LTP_STATUS.
       ui.js, *-dialog.js: read window.LTP_THEME.
       error-toasts.js: listens to "ltp-api-error" CustomEvents dispatched by data-state.js. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"
          integrity="sha384-qJNkHwhlYywDHfyoEe1np+1lYvX/8x+3gHCKFhSSBMQyCFlvFnn+zXmaebXl21rV"
          crossorigin="anonymous"></script>
  <!-- signature_pad — exposes window.SignaturePad. Only used by
       modules/client-view.js for the client accept-quote signature canvas;
       loaded globally so the SPA's lazy modules don't have to dynamic-import. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/5.0.4/signature_pad.umd.min.js"
          integrity="sha384-sAvQstqOmAfqxD54T2ZBU8/E8IQJJuNT4hEHwUULkoBRze+eTQ7tZNcXEA5yPzhE"
          crossorigin="anonymous"></script>
  <script src="components/sanitize.js"></script>
  <script src="components/helpers.js"></script>
  <script src="components/data-state.js"></script>
  <script src="components/ui.js"></script>
  <script src="components/search-select.js"></script>
  <script src="components/rich-text-editor.js"></script>
  <script src="components/email-body-editor.js"></script>
  <script src="components/recipient-editor.js"></script>
  <script src="components/schedule-editor.js"></script>
  <script src="components/confirm-dialog.js"></script>
  <script src="components/error-boundary.js"></script>
  <script src="components/error-toasts.js"></script>
  <script src="components/crew-outbox.js"></script>

  <!-- 6a. CRM sub-modules (leaves first, shell last) -->
  <script src="modules/calendar-grid.js"></script>
  <script src="modules/crm-notes.js"></script>
  <script src="modules/crm-meetings.js"></script>
  <script src="modules/crm-contacts.js"></script>
  <script src="modules/crm-companies.js"></script>
  <script src="modules/crm-projects.js"></script>
  <script src="modules/crm-shell.js"></script>

  <!-- 6b. Dashboard -->
  <script src="modules/dashboard.js"></script>

  <!-- 6c. Rentals sub-modules (utils first, shell last) -->
  <script src="modules/rentals-utils.js"></script>
  <script src="modules/rentals-maintenance.js"></script>
  <script src="modules/rentals-equipment.js"></script>
  <script src="modules/rentals-availability.js"></script>
  <script src="modules/rentals-inventory.js"></script>
  <script src="modules/rentals-containers.js"></script>
  <script src="modules/rentals-kits.js"></script>
  <script src="modules/rentals-shell.js"></script>

  <!-- 6d. Quotes sub-modules.
       quotes-list.js MUST load before quotes-builder.js and invoices.js
       because it exports the totals helpers both consume (LTP_QUOTE_TOTALS, etc.). -->
  <script src="modules/quotes-list.js"></script>
  <script src="modules/quotes-builder.js"></script>
  <script src="modules/quotes-products.js"></script>
  <script src="modules/quotes-services.js"></script>
  <script src="modules/quotes-shell.js"></script>

  <!-- 6e. Remaining feature modules -->
  <script src="modules/invoices.js"></script>
  <script src="modules/labor.js"></script>
  <script src="modules/settings.js"></script>
  <script src="modules/schedule-builder.js"></script>
  <script src="modules/projects.js"></script>
  <script src="modules/calendar.js"></script>
  <!-- Public client view — rendered by app.js's outer LTPApp when the URL
       starts with #/view/. Loaded here so app.js can reference window.LTPClientView. -->
  <script src="modules/client-view.js"></script>
  <!-- Public crew-request view — rendered when the URL starts with #/crew/.
       Loaded here so app.js can reference window.LTPCrewView. -->
  <script src="modules/crew-view.js"></script>

  <!-- 7. App shell — wires everything -->
  <script src="app.js"></script>

  <!-- 8. Mount — kept in its own file (not inline) so the CSP header in
       backend/main.py can use `script-src 'self'` without `'unsafe-inline'`.
       MUST load after app.js. -->
  <script src="mount.js"></script>

  <!-- 9. PWA service-worker registration + "new version" prompt. Same-origin
       file (CSP-safe, like mount.js). Loads last; registers on window 'load'
       so it never blocks first paint. -->
  <script src="components/register-sw.js"></script>

  <!-- 10. Web Push helper (window.LTP_Push). Same-origin/CSP-safe. Defines the
       subscribe/unsubscribe API used by the Settings "Notifications" toggle;
       loads after register-sw.js so window.LTP_isStandalone is available. -->
  <script src="components/push.js"></script>
</body>
</html>
