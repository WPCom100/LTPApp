name: tests

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend JS suites (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run all JS test suites
        run: |
          set -e
          for f in tests/test_*.js; do
            echo "== $f =="
            node "$f"
          done

  # Only meaningful on a pull request: it compares the branch against its base.
  # A push build has nothing to diff against, so this job is skipped there.
  shell-version:
    name: Shell version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard diffs against the merge base, so it needs real history —
          # the default shallow checkout has none and `git diff base...HEAD`
          # would fail (exit 2, which fails the job rather than passing blindly).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Frontend filenames are un-versioned, so sw.js's CACHE_VERSION is the only
      # cache-busting lever. Shipping a cached-file change without bumping it
      # means no update banner AND a stale shell on every device for one more
      # launch — this has happened twice. No pip install: stdlib only.
      - name: Require a CACHE_VERSION bump for cached-file changes
        run: python tests/check_shell_version.py "origin/${{ github.base_ref }}"

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest pytest-asyncio
      # tests/conftest.py pins one shared file-based DATABASE_URL for the
      # whole session, so the suite runs combined — same as a local `pytest`.
      # (It previously had to run file-by-file because the first-imported
      # module's ":memory:" DATABASE_URL won the setdefault race for the
      # whole process and the schema never reached the app engine.)
      - name: Run backend tests
        run: python -m pytest tests -q
