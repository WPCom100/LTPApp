name: tests

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend JS suites (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run all JS test suites
        run: |
          set -e
          for f in tests/test_*.js; do
            echo "== $f =="
            node "$f"
          done

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest pytest-asyncio
      # tests/conftest.py pins one shared file-based DATABASE_URL for the
      # whole session, so the suite runs combined — same as a local `pytest`.
      # (It previously had to run file-by-file because the first-imported
      # module's ":memory:" DATABASE_URL won the setdefault race for the
      # whole process and the schema never reached the app engine.)
      - name: Run backend tests
        run: python -m pytest tests -q
