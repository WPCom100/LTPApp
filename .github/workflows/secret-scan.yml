name: secret-scan

# Prevent committing secrets or token-bearing files going forward
# (docs/SECURITY_REVIEW.md C2 follow-up). Runs gitleaks on every push and PR.
#
# Uses the gitleaks binary directly (no marketplace-action license needed) in
# `dir` mode, which scans the checked-out WORKING TREE. It deliberately does
# NOT rescan full git history: the previously-committed *.db files live in old
# commits whose leaked tokens have already been revoked + the encryption key
# rotated, so a history scan would only fail perpetually on dead secrets. The
# tree scan is what stops NEW secrets (and the *.db gitignore stops the files).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan working tree for secrets
        run: gitleaks dir . --redact --no-banner --exit-code 1
