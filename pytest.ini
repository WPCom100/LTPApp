[pytest]
# The async backend tests (e.g. test_quickbooks_sync.py) are written as bare
# `async def test_*` functions with no per-test marker, so pytest-asyncio must
# run in auto mode to collect them. Without this they error with "async def
# functions are not natively supported" and the whole file is reported failed.
#
# NOTE: each test module pins its OWN DATABASE_URL via os.environ.setdefault,
# which is process-global — so a combined `pytest` run makes the modules
# collide on one DB. Run the suite FILE-BY-FILE (one module per process), e.g.
#   for f in tests/test_*.py; do python -m pytest "$f"; done
asyncio_mode = auto
